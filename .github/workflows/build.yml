name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest runners already ship an Android SDK under $ANDROID_HOME,
      # but cmdline-tools/*/bin (where sdkmanager lives) is not on PATH by
      # default. android-actions/setup-android@v3 also tries to install the
      # long-removed legacy `tools` package and fails, so we locate the
      # preinstalled sdkmanager ourselves instead of using that action.
      - name: Install SDK platform, build-tools and NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" "ndk;28.0.13004108"
      - run: chmod +x gradlew && ./gradlew assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
      - uses: actions/upload-artifact@v4
        with:
          name: diskusage-debug
          path: app/build/outputs/apk/debug/*.apk
