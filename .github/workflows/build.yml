name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest runners already ship an Android SDK (cmdline-tools on
      # PATH via $ANDROID_HOME). android-actions/setup-android@v3 tries to
      # install the long-removed legacy `tools` package and fails, so we use
      # the preinstalled sdkmanager directly instead.
      - name: Install SDK platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;28.0.13004108"
      - run: chmod +x gradlew && ./gradlew assembleDebug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.0.13004108
      - uses: actions/upload-artifact@v4
        with:
          name: diskusage-debug
          path: app/build/outputs/apk/debug/*.apk
