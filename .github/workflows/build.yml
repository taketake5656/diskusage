name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Creating releases for version tags
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # JDK 21 runs the Gradle daemon (gradle/gradle-daemon-jvm.properties),
      # JDK 17 is the toolchain the app is compiled with.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      # The Android SDK layout of the runner images isn't reliable, so install
      # Google's official cmdline-tools into a fresh SDK root.
      - name: Install Android SDK
        run: |
          set -eu
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "ndk;29.0.14206865" "cmake;4.1.2" "platform-tools"

      # Release builds are signed only when the key is configured in the
      # repository secrets, so builds of forks and pull requests stay unsigned.
      - name: Set up release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ORG_GRADLE_PROJECT_diskusageKeystoreFile=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        env:
          ORG_GRADLE_PROJECT_diskusageKeystorePassword: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_diskusageKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_diskusageKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: diskusage-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: diskusage-release
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Check the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" || { echo "::error::Release signing key is not configured"; exit 1; }
          VERSION=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "::error::Version $VERSION doesn't match tag $GITHUB_REF_NAME"; exit 1; }

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: app/build/outputs/apk/release/*.apk
