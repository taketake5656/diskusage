[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coroutines = "1.11.0"
splitties = "3.0.0"

[libraries]
androidx-activity = { module = "androidx.activity:activity-ktx", version = "1.13.0" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.8.0" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.2" }
androidx-core = { module = "androidx.core:core-ktx", version = "1.19.1" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.11.0" }
androidx-preference = { module = "androidx.preference:preference-ktx", version = "1.2.1" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
appiconloader = { module = "me.zhanghai.android.appiconloader:appiconloader", version = "1.5.0" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
splitties-resources = { module = "com.louiscad.splitties:splitties-resources", version.ref = "splitties" }
splitties-toast = { module = "com.louiscad.splitties:splitties-toast", version.ref = "splitties" }
timber = { module = "com.jakewharton.timber:timber", version = "5.0.1" }
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
